<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이승민의 홈페이지</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>이름: 이승민</h1>
        <p class="subtitle">한 줄 소개: 광운대학교 경영학부 빅데이터경영학과 25학번</p>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html">Contact</a>
    </nav>
    <main class="container">
        <section>
            <script>
                let defaultList = "짜장면, 짬뽕, 볶음밥";
                let inputString = prompt("항목을 콤마(,)로 구분하여 입력하세요", defaultList);
                if (!inputString || null) {
                    document.write("<h3>뽑기를 취소했습니다.</h3>");
                } else {
                    let items = inputString.split(',');
                    let index = Math.floor(Math.random() * items.length);
                    let choice = items[index].trim();
                    document.write("<h1> " + choice + " !</h1>");
                }
            </script>
        </section>
    </main>
    <footer>
        <small>&copy; <span id="year"></span> 이름: 이승민</small>
    </footer>
    <script src="script.js"></script>
</body>

</html>
