<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이승민의 홈페이지</title>
  <link rel="stylesheet" href="style.css">
  <style>
    bodu {
        font-family: 'Noto Sans KR', sans-serif;
        text-align: center;
        padding: 50px;
    }
    #target {
        font-size: 20px;
        font-weight: bold;
        padding: 20px;
        border: 2px solid #ccc;
        margin: 20px auto;
        width: 80%;
        transition: all 0.3s;
    }
    button {
        padding: 10px 15px;
        font-size: 16px;
        margin: 5px;
        cursor: pointer;
        background-color: #e9900c;
        border: 1px solid #999;
        border-radius: 5px;
    }
    button:hover {
        background-color: #e04721;
    }
  </style>
  <script>
    function changeColor() {
        var obj = document.getElementById("target");
        obj.style.color = "#ec5555";
    }
    function changeSize() {
        var obj = document.getElementById("target");
        obj.style.fontSize = "32px";
    }
    function changeBackground() {
        var obj = document.getElementById("target");
        obj.style.backgroundColor = "#eeb54a";
    }
    function toggleVisibility() {
        var obj = document.getElementById("target");
        if(obj.style.display == "none") {
            obj.style.display = "block";
        } else {
            obj.style.display = "none";
        }
    }
  </script> 
</head>

<body>
  <header>
    <h1>이름: 이승민</h1>
    <p class="subtitle">한 줄 소개: 광운대학교 경영학부 빅데이터경영학과 25학번</p>
  </header>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main class="container">
    <section>
      <h2>DOM 스타일 변환 실험기</h2>
      <p id="target">이 문장의 스타일을 바꿔보세요!</p>
        <button onclick="changeColor()">글자색 변경</button>
        <button onclick="changeSize()">크기 변경</button>
        <button onclick="changeBackground()">배경 강조</button>
        <button onclick="toggleVisibility()">숨기기/보이기</button>
    </section>
  </main>
  <footer>
    <small>&copy; <span id="year"></span> 이름: 이승민</small>
  </footer>
  <script src="script.js"></script>
</body>

</html>
